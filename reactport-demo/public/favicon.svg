  <rect width="32" height="32" rx="7" fill="#ff6a00"/>
  <!-- Briefcase body -->
  <rect x="5" y="14" width="22" height="13" rx="2.5" fill="white"/>
  <!-- Briefcase handle -->
  <path d="M11 14v-3.5a2.5 2.5 0 0 1 2.5-2.5h5a2.5 2.5 0 0 1 2.5 2.5V14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Middle clasp -->
