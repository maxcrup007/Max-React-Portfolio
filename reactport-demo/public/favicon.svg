  <!-- Horizontal divider line -->
  <line x1="5" y1="20" x2="13.5" y2="20" stroke="#ff6a00" stroke-width="1.5"/>
  <line x1="18.5" y1="20" x2="27" y2="20" stroke="#ff6a00" stroke-width="1.5"/>
</svg>
